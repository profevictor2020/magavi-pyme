name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: magavi
          POSTGRES_USER: magavi
          POSTGRES_PASSWORD: magavi_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magavi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: magavi
      POSTGRES_USER: magavi
      POSTGRES_PASSWORD: magavi_test_password
      DJANGO_SECRET_KEY: ci-test-secret-key-with-enough-entropy-for-hs256-please
      # Las tareas de Celery corren en el mismo proceso, sin necesitar
      # Redis (ver docs/DECISIONS.md ADR-007 y config/settings.py).
      CELERY_TASK_ALWAYS_EAGER: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar Tesseract (OCR, ver docs/DECISIONS.md ADR-011)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - run: pip install -r requirements-dev.txt
      - name: Escanear vulnerabilidades de dependencias (ver docs/SECURITY.md #12)
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py migrate --noinput
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Escanear vulnerabilidades de dependencias (ver docs/SECURITY.md #12)
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env
        run: cp .env.example .env
      - name: Levantar stack completo (docker compose up)
        run: docker compose up --build -d
      - name: Esperar y verificar backend (/api/health/)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health/; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "El backend no respondio 200 en /api/health/" >&2
          docker compose logs
          exit 1
      - name: Verificar frontend (servidor Vite responde)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "El frontend no respondio en :5173" >&2
          docker compose logs
          exit 1
      - name: Logs (siempre, para diagnostico)
        if: always()
        run: docker compose logs
      - name: Apagar stack
        if: always()
        run: docker compose down -v

  # Guion de demo completo (ver docs/ROADMAP.md Fase 12): levanta el
  # stack real (igual que el job `compose`, más un LLM de prueba
  # determinístico — ver docker-compose.e2e.yml y
  # backend/scripts/e2e_fake_llm.py) y corre el recorrido completo con
  # Playwright en viewport móvil contra la app real, no mocks.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env
        run: cp .env.example .env
      - name: Levantar stack completo + LLM de prueba (docker compose up)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d
      - name: Esperar y verificar backend (/api/health/)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health/; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "El backend no respondio 200 en /api/health/" >&2
          docker compose logs
          exit 1
      - name: Esperar frontend (servidor Vite responde)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "El frontend no respondio en :5173" >&2
          docker compose logs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Instalar navegador de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Correr el guion de demo (Playwright, viewport móvil)
        working-directory: frontend
        run: npx playwright test
      - name: Subir reporte de Playwright (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Logs (siempre, para diagnostico)
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs
      - name: Apagar stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
