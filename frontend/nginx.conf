# Servido por el contenedor "frontend" en producción (ver
# Dockerfile.prod, docker-compose.prod.yml, docs/DEPLOY.md). Sirve el
# build estático de la PWA, hace de reverse proxy hacia el backend para
# /api/ (mismo origen => sin CORS en producción) y sirve /media/
# directamente desde el volumen compartido con el backend (ver
# docs/ARCHITECTURE.md #3.7: en producción los archivos de media los
# sirve NGINX, no Django).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # El Service Worker (ver public/sw.js) debe revisarse en cada carga,
    # nunca servirse desde una caché de navegador/proxy vieja, o una
    # actualización de la app podría no llegarle nunca a un usuario.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /app/media/;
    }

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (React Router maneja el resto client-side).
    location / {
        try_files $uri /index.html;
    }
}
