[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "core",
    "accounts",
    "companies",
    "catalog",
    "sales",
    "purchases",
    "inventory",
    "cashbox",
    "documents",
    "assistant",
    "audit",
]
