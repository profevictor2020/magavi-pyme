services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magavi}
      POSTGRES_USER: ${POSTGRES_USER:-magavi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magavi_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magavi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      LLM_OLLAMA_BASE_URL: http://llm-inference:11434
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Opcional, apagado por defecto (no lo levanta `docker compose up` ni
  # el job de CI): motor de inferencia self-hosted para el asistente
  # (ver docs/DECISIONS.md ADR-004, docs/ROADMAP.md Fase 8). Requiere
  # cómputo real (GPU o CPU capaz) y varios GB de disco para el modelo,
  # que no están disponibles en todos los entornos de desarrollo.
  #
  # Uso: docker compose --profile llm up
  #      docker compose exec llm-inference ollama pull qwen2.5:7b-instruct
  llm-inference:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  postgres_data:
  frontend_node_modules:
  ollama_data:
